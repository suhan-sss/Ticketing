<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · TicketDesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="css/custom.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen grid place-items-center bg-gradient-to-br from-brand-50 via-white to-slate-100 dark:from-slate-900 dark:to-slate-950 p-4">

  <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-8">
    <div class="flex items-center gap-2 mb-6">
      <div class="w-10 h-10 rounded-xl bg-brand-600 text-white grid place-items-center font-bold text-lg">T</div>
      <div>
        <div class="font-semibold text-slate-800 dark:text-slate-100 text-lg">TicketDesk</div>
        <div class="text-xs text-slate-500">Customer support · Sign in</div>
      </div>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
        <input id="login-email" type="email" required placeholder="you@company.com"
               class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
        <input id="login-pass" type="password" required placeholder="••••••••"
               class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Role (demo)</label>
        <select id="login-role"
                class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
          <option value="agent">Agent</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="w-full py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium transition">Sign in</button>
    </form>

    <p class="text-xs text-slate-500 mt-6 text-center">Demo build · use any credentials</p>
  </div>

  <script src="config/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // If already logged in, redirect away
    if (Auth.isLoggedIn()) window.location.href = "index.html";

    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      Auth.login(
        document.getElementById("login-email").value,
        document.getElementById("login-pass").value,
        document.getElementById("login-role").value,
      );
    });
  </script>
</body>
</html>
