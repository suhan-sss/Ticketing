<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket · TicketDesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="css/custom.css">
  <link rel="stylesheet" href="css/components.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="w-[204px] bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col shrink-0"></aside>

    <main class="flex-1 flex flex-col min-w-0">
      <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 flex items-center gap-3">
        <a href="index.html" class="text-sm text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">← All tickets</a>
        <div class="ml-auto flex items-center gap-2">
          <button id="btn-theme" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <div class="flex-1 p-4 sm:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-4 max-w-7xl mx-auto">
          <!-- Main column -->
          <div class="min-w-0 space-y-4">
            <div id="ticket-host" class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-5"></div>

            <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-5">
              <h3 class="font-semibold text-slate-800 dark:text-slate-100 text-sm mb-3">Conversation</h3>
              <div id="timeline-host" class="space-y-4"></div>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4">
              <textarea id="reply-text" rows="3" placeholder="Type your reply… (Ctrl+Enter to send)"
                        class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
              <div class="mt-2 flex justify-end">
                <button id="reply-send" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Send Reply</button>
              </div>
            </div>
          </div>

          <!-- Sidebar -->
          <aside id="sidebar-host" class="space-y-4"></aside>
        </div>
      </div>
    </main>
  </div>

  <script src="config/config.js"></script>
  <script src="config/ai-config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/badge.js"></script>
  <script src="js/components/sla-indicator.js"></script>
  <script src="js/components/agent-dropdown.js"></script>
  <script src="js/components/tag-input.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/timeline.js"></script>
  <script src="js/components/condition-builder.js"></script>
  <script src="js/templates/ticket-card.js"></script>
  <script src="js/ai/rag.js"></script>
  <script src="js/ai/llm.js"></script>
  <script src="js/ai/escalate.js"></script>
  <script src="js/ai/chatbot.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/detail.js"></script>
  <script>
    initChatWidget({
      welcomeMessage: AI_CONFIG.welcomeMessage,
      suggestedQuestions: AI_CONFIG.suggestedQuestions,
      escalationEndpoint: "Escalate.toTicket",
    });
  </script>
</body>
</html>
