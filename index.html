<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets · TicketDesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="css/custom.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-[204px] bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col shrink-0"></aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col min-w-0">
      <!-- Topbar -->
      <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 flex items-center gap-3">
        <button id="btn-sidebar" class="md:hidden p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="relative flex-1 max-w-xl">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="Search tickets, customers, IDs…"
                 class="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <button id="btn-theme" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800" title="Toggle dark mode">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="new.html" class="px-3 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium flex items-center gap-1.5">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
          New Ticket
        </a>
      </header>

      <div class="flex-1 p-4 sm:p-6 space-y-4 overflow-x-auto">
        <!-- Stat tiles -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
          <div class="stat-tile flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-700 grid place-items-center"><span class="font-bold">O</span></div>
            <div><div class="text-xs text-slate-500">Open</div><div id="count-open" class="text-xl font-bold">0</div></div>
          </div>
          <div class="stat-tile flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-amber-100 text-amber-700 grid place-items-center"><span class="font-bold">P</span></div>
            <div><div class="text-xs text-slate-500">In Progress</div><div id="count-progress" class="text-xl font-bold">0</div></div>
          </div>
          <div class="stat-tile flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-purple-100 text-purple-700 grid place-items-center"><span class="font-bold">W</span></div>
            <div><div class="text-xs text-slate-500">Waiting</div><div id="count-waiting" class="text-xl font-bold">0</div></div>
          </div>
          <div class="stat-tile flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-700 grid place-items-center"><span class="font-bold">R</span></div>
            <div><div class="text-xs text-slate-500">Resolved</div><div id="count-resolved" class="text-xl font-bold">0</div></div>
          </div>
        </div>

        <!-- Filters + view toggle -->
        <div class="flex flex-wrap items-center gap-2">
          <select id="filter-priority" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm">
            <option value="">All priorities</option>
            <option>URGENT</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option>
          </select>
          <select id="filter-status" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm">
            <option value="">All statuses</option>
            <option>OPEN</option><option>IN_PROGRESS</option><option>WAITING</option><option>RESOLVED</option><option>CLOSED</option>
          </select>
          <select id="filter-channel" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm">
            <option value="">All channels</option>
            <option>email</option><option>chat</option><option>phone</option><option>webform</option>
          </select>
          <select id="filter-agent" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm"></select>

          <div class="ml-auto inline-flex rounded-lg border border-slate-300 dark:border-slate-700 overflow-hidden">
            <button data-view="table" class="px-3 py-1.5 text-sm font-medium bg-brand-600 text-white">Table</button>
            <button data-view="kanban" class="px-3 py-1.5 text-sm font-medium bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Kanban</button>
          </div>
        </div>

        <!-- Layout -->
        <div class="grid grid-cols-1 xl:grid-cols-[1fr_280px] gap-4">
          <div id="view-host" class="min-w-0"></div>
          <aside class="space-y-4">
            <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4">
              <h3 class="font-semibold text-slate-800 dark:text-slate-100 text-sm mb-3">Agent Workload</h3>
              <div id="workload-host" class="space-y-3"></div>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts (load order matters) -->
  <script src="config/config.js"></script>
  <script src="config/ai-config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/badge.js"></script>
  <script src="js/components/sla-indicator.js"></script>
  <script src="js/components/agent-dropdown.js"></script>
  <script src="js/components/tag-input.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/timeline.js"></script>
  <script src="js/components/kanban.js"></script>
  <script src="js/components/table.js"></script>
  <script src="js/components/workload-widget.js"></script>
  <script src="js/components/condition-builder.js"></script>
  <script src="js/templates/ticket-card.js"></script>
  <script src="js/ai/rag.js"></script>
  <script src="js/ai/llm.js"></script>
  <script src="js/ai/escalate.js"></script>
  <script src="js/ai/chatbot.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/list.js"></script>
  <script>
    initChatWidget({
      position: "bottom-right",
      welcomeMessage: AI_CONFIG.welcomeMessage,
      suggestedQuestions: AI_CONFIG.suggestedQuestions,
      escalationEndpoint: "Escalate.toTicket",
    });
  </script>
</body>
</html>
